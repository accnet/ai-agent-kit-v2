version: 2.0.0

# v2 uses nested reference knowledge rather than v1's one-SKILL-per-folder
# contract. The router discovers these entries dynamically, so new technology
# folders do not require registry churn.
skills_root: .ai/skills
layout: domain/technology
required_documents:
  - overview.md
  - patterns.md
  - best-practices.md
  - pitfalls.md
  - examples.md

core_skills:
  path: .ai/skills/core
  source: v1-adapted
  contract: SKILL.md plus v2 adapter documents
  names: [accessibility, api-contract, architecture-decisions, code-review, contract-testing, data-migration, debugging, dependency-management, deployment-infra, documentation-maintenance, e2e-testing, frontend-core, github-actions-ci, integration-contracts, nodejs-api-core, observability, performance-profiling, refactoring, release-management, requirements-intake, security-review, skill-router, test-and-validation, threat-modeling, webhooks-and-retries, workflow-orchestration]

stack_skills:
  nestjs-core: {path: .ai/skills/backend/nestjs-core, stack: [nestjs]}
  nestjs-data-access: {path: .ai/skills/backend/nestjs-data-access, stack: [nestjs, database]}
  vite-frontend: {path: .ai/skills/frontend/vite-frontend, stack: [vite]}
  react-vite: {path: .ai/skills/frontend/react-vite, stack: [react, vite]}
  vitest-testing: {path: .ai/skills/testing/vitest-testing, stack: [vitest]}
  docker-compose-local: {path: .ai/skills/devops/docker-compose-local, stack: [docker, compose]}
  backend-python: {path: .ai/skills/backend/python, stack: [python]}
  backend-fastapi: {path: .ai/skills/backend/fastapi, stack: [python, fastapi]}
  frontend-typescript: {path: .ai/skills/frontend/typescript, stack: [typescript]}
  frontend-nextjs: {path: .ai/skills/frontend/nextjs, stack: [nextjs, react]}
  frontend-tailwind: {path: .ai/skills/frontend/tailwind, stack: [tailwind]}
  testing-pytest: {path: .ai/skills/testing/pytest, stack: [pytest, python]}
  testing-playwright: {path: .ai/skills/testing/playwright, stack: [playwright]}
  database-pgvector: {path: .ai/skills/database/pgvector, stack: [postgresql, pgvector, rag]}
  database-qdrant: {path: .ai/skills/database/qdrant, stack: [qdrant, rag]}
  devops-terraform: {path: .ai/skills/devops/terraform, stack: [terraform]}
  devops-prometheus: {path: .ai/skills/devops/prometheus, stack: [prometheus, observability]}
  devops-grafana: {path: .ai/skills/devops/grafana, stack: [grafana, observability]}
  ai-llm-application: {path: .ai/skills/ai/llm-application, stack: [llm, ai]}
  ai-prompt-engineering: {path: .ai/skills/ai/prompt-engineering, stack: [llm, prompts, ai]}
  ai-ai-safety: {path: .ai/skills/ai/ai-safety, stack: [llm, safety, ai]}
  ai-model-evaluation: {path: .ai/skills/ai/model-evaluation, stack: [evaluation, llm, ai]}
  ai-llm-observability: {path: .ai/skills/ai/llm-observability, stack: [observability, llm, ai]}
  ai-agent-orchestration: {path: .ai/skills/ai/agent-orchestration, stack: [agents, orchestration, ai]}
  ai-embeddings: {path: .ai/skills/ai/embeddings, stack: [embeddings, rag, ai]}
  ai-vector-search: {path: .ai/skills/ai/vector-search, stack: [vector, retrieval, rag, ai]}
  ai-ai-data-governance: {path: .ai/skills/ai/ai-data-governance, stack: [governance, privacy, ai]}
  ai-ai-cost-management: {path: .ai/skills/ai/ai-cost-management, stack: [cost, llm, ai]}

skill_triggers:
  # AGENTS.md's mandatory-concerns table (the general one, not the AI-specific
  # table below it) had no trigger implementing three of its rows: auth,
  # UI interaction, and new/upgraded dependencies never actually routed to
  # Security/Frontend/DevOps regardless of task content. These three close
  # that gap.
  auth-security:
    match: ["auth", "oauth", "login", "logout", "sso", "jwt", "password", "credential", "permission", "authoriz", "rbac", "session token", "access token", "refresh token", "sensitive data", "pii", "untrusted input", "encryption"]
    core_skills: ["security-review", "threat-modeling"]
    technology_skills: []
    reason: "Auth, permissions, credentials, or sensitive/untrusted data require a security review pass (AGENTS.md mandatory concerns)."
  ui-interaction:
    match: ["ui component", "button", "modal", "dialog", "dropdown", "form field", "accessibility", "aria", "screen reader", "keyboard navigation", "responsive layout"]
    core_skills: ["accessibility", "frontend-core"]
    technology_skills: []
    reason: "UI interaction changes require accessibility and frontend-core review (AGENTS.md mandatory concerns)."
  dependency-change:
    match: ["upgrade", "bump", "dependency", "package version", "npm install", "pip install", "new dependency", "third-party package", "add a library"]
    core_skills: ["dependency-management"]
    technology_skills: []
    reason: "New or upgraded dependencies require a dependency-management review pass (AGENTS.md mandatory concerns)."
  coordination-handoff:
    match: ["parallel task", "parallel work", "parallel agent", "concurrent task", "concurrent worker", "blocked work", "handoff", "hand-off", "task retry"]
    core_skills: ["workflow-orchestration"]
    technology_skills: []
    reason: "Parallel tasks, blocked work, and handoffs require explicit workflow-orchestration coordination (AGENTS.md mandatory concerns)."
  user-journey-boundary:
    match: ["user journey", "end-to-end", "e2e", "public api", "api boundary", "event boundary", "public endpoint"]
    core_skills: ["e2e-testing", "contract-testing"]
    technology_skills: []
    reason: "User journeys and public API/event boundaries require end-to-end and contract test coverage (AGENTS.md mandatory concerns)."
  architecture-tradeoff:
    match: ["cross-cutting", "trade-off", "tradeoff", "architectural decision", "durable decision", "design decision"]
    core_skills: ["architecture-decisions"]
    technology_skills: []
    reason: "Cross-cutting or durable trade-offs require an explicit architecture-decisions record (AGENTS.md mandatory concerns). Kept separate from architecture-pipeline below: that one matches the bare word 'architecture', which is not a substring of 'architectural' -- this trigger covers the word forms AGENTS.md's own row actually uses."
  prompt-injection:
    match: ["prompt injection", "jailbreak", "system prompt leak", "tool abuse"]
    core_skills: ["threat-modeling", "security-review"]
    technology_skills: ["ai/ai-safety"]
    reason: "Untrusted prompt content or instruction override risk requires AI safety and threat controls."
  # Split from a single "latency-cost-token" trigger: that trigger matched bare
  # "token" and "cost", which fired on ANY task mentioning a "refresh token" or
  # having a dollar "cost" -- e.g. an OAuth task pulled in ai/ai-cost-management
  # purely because it said "token refresh". performance-latency now covers
  # AGENTS.md's generic Performance row (latency/throughput/memory/query
  # volume) without forcing in AI-specific skills; ai-cost-token is scoped to
  # phrases that only make sense for LLM token/cost pressure.
  performance-latency:
    match: ["latency", "slow response", "p95", "p99", "throughput", "query volume", "memory pressure"]
    core_skills: ["performance-profiling", "observability"]
    technology_skills: []
    reason: "Latency/throughput/memory/query-volume concerns require measured baselines and observability (AGENTS.md Performance row)."
  ai-cost-token:
    match: ["token budget", "token limit", "token usage", "prompt tokens", "completion tokens", "context window", "llm cost", "inference cost", "api spend", "token cost", "cost per request"]
    core_skills: ["performance-profiling", "observability"]
    technology_skills: ["ai/llm-observability", "ai/ai-cost-management"]
    reason: "LLM token/cost pressure requires AI cost telemetry in addition to standard performance controls."
  evaluation:
    match: ["evaluation", "benchmark", "quality score", "regression set", "hallucination rate"]
    core_skills: ["test-and-validation", "e2e-testing"]
    technology_skills: ["ai/model-evaluation"]
    reason: "Evaluation changes require reproducible quality and end-to-end validation evidence."
  external-provider-api:
    match: ["external provider", "third-party api", "webhook", "callback", "event consumer", "provider sdk"]
    core_skills: ["integration-contracts", "contract-testing", "webhooks-and-retries"]
    technology_skills: ["ai/llm-application"]
    reason: "Provider and callback boundaries require contract safety and retry discipline."
  architecture-pipeline:
    match: ["architecture", "pipeline", "orchestration", "multi-agent", "state machine"]
    core_skills: ["architecture-decisions"]
    technology_skills: ["ai/agent-orchestration"]
    reason: "Cross-cutting pipeline changes require explicit architecture decisions."
  rag-retrieval:
    match: ["rag", "retrieval", "vector search", "semantic search", "embeddings"]
    core_skills: []
    technology_skills: ["ai/rag", "ai/embeddings", "ai/vector-search", "ai/model-evaluation"]
    reason: "Retrieval workloads require RAG pipeline, embedding, and retrieval quality controls."
  llm-model:
    match: ["llm", "model", "gpt", "openai", "inference", "completion", "prompt"]
    core_skills: ["threat-modeling", "performance-profiling", "observability"]
    technology_skills: ["ai/openai", "ai/llm-application"]
    reason: "Model integration requires provider handling plus security and performance guardrails."

owners:
  planner: []
  researcher: []
  architect: [ai]
  backend: [backend, database, ai]
  frontend: [frontend]
  database: [database]
