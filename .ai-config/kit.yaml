kit:
  id: ai-kit-v2
  version: 2.0.0
  entrypoint: AGENTS.md
  work_dir: .ai-work
  skills_dir: .ai/skills
  registry: .ai-config/registry.yaml

project:
  stack: [python]
  source_dirs: [.ai/engine, .ai/scripts, tests]

# The kit dogfoods its own gates: these are the same checks .github/workflows/
# gates.yml runs. Leaving them at the 'true' sentinel (as the install template
# ships, since a fresh project does not yet know its stack) makes `ai-kit verify`
# report INCONCLUSIVE and blocks `ai-kit pipeline` -- correct for a project that
# has not been onboarded, wrong for this repo, which has a real test suite.
verification:
  test_command: python3 -m unittest discover -s tests
  typecheck_command: true
  build_command: true
  lint_command: true
