default_executor: "opencode-deepseek-v4-pro"

runners:
  claude:
    command: "env -u ANTHROPIC_AUTH_TOKEN -u ANTHROPIC_BASE_URL claude -p {prompt} --permission-mode acceptEdits"
    provider: "claude-cli"
    description: "Claude CLI runner"
  cline-pass:
    command: "cline -P cline-pass -m 'cline-pass/glm-5.2' --auto-approve true {prompt}"
    model: "glm-5.2"
    provider: "cline-pass"
    description: "Cline pass runner"
  codex-5.5:
    command: "echo '' | codex exec -m 5.5 {prompt}"
    model: "5.5"
    provider: "codex-cli"
    description: "Codex 5.5 runner"
  codex-5.6-luna:
    command: "echo '' | codex exec -m gpt-5.6-luna {prompt}"
    model: "gpt-5.6-luna"
    provider: "codex-cli"
    description: "Codex Luna runner"
  gemini:
    command: "gemini -y -p {prompt}"
    provider: "gemini-cli"
    description: "Gemini CLI runner"
  deepseek-v4-flash:
    command: "cline -P deepseek -m 'deepseek-v4-flash' --auto-approve true {prompt}"
    model: "deepseek-v4-flash"
    provider: "cline"
    description: "DeepSeek V4 Flash runner"
  deepseek-v4-pro:
    command: "cline -P deepseek -m 'deepseek-v4-pro' --auto-approve true {prompt}"
    model: "deepseek-v4-pro"
    provider: "cline"
    description: "DeepSeek V4 Pro runner"
  opencode-deepseek-v4-flash:
    command: "opencode run {prompt} --model deepseek/deepseek-v4-flash"
    model: "deepseek-v4-flash"
    provider: "opencode-cli"
    description: "OpenCode CLI runner with DeepSeek V4 Flash model"
  opencode-deepseek-v4-pro:
    command: "opencode run {prompt} --model deepseek/deepseek-v4-pro"
    model: "deepseek-v4-pro"
    provider: "opencode-cli"
    description: "OpenCode CLI runner with DeepSeek V4 Pro model"
