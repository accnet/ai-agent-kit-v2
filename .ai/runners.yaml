default_executor: "copilot-cli"
default_model: "gpt-5.6-luna"

runners:
  claude-cli:
    command: "env -u ANTHROPIC_AUTH_TOKEN -u ANTHROPIC_BASE_URL claude -p {prompt} --permission-mode acceptEdits"
    provider: "claude-cli"
    description: "Claude CLI runner"
  codex-cli:
    command: "echo '' | codex exec -m {model} {prompt}"
    models: ["gpt-5.6-luna"]
    provider: "codex-cli"
    description: "Codex CLI runner"
  cline-pass:
    command: "cline -P cline-pass -m 'cline-pass/{model}' --auto-approve true {prompt}"
    models: ["glm-5.2"]
    provider: "cline-pass"
    description: "Cline pass runner"
  cline:
    command: "cline -P deepseek -m 'deepseek/{model}' --auto-approve true {prompt}"
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
    provider: "cline"
    description: "Cline DeepSeek runner"
  opencode-cli:
    command: "opencode run {prompt} --model deepseek/{model}"
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
    provider: "opencode-cli"
    description: "OpenCode CLI runner"
  copilot-cli:
    command: "copilot -p {prompt} --model {model} --allow-all-tools --log-level error"
    models: ["gpt-5.6-luna", "gpt-5.6-terra", "gemini-3.6-flash", "gemini-3.5-flash", "gpt-5.4", "gpt-5.4-mini", "claude-opus-4.8-fast", "grok-4.5", "kimi-k2.7-code", "gpt-4o", "gpt-4o-mini", "gpt-4o-mini-2024-08-23"]
    provider: "copilot-cli"
    description: "GitHub Copilot CLI runner"

runner_aliases:
  claude: "claude-cli"
  codex-5.6-luna: "codex-cli:gpt-5.6-luna"
  cline-pass: "cline-pass:glm-5.2"
  deepseek-v4-flash: "cline:deepseek-v4-flash"
  deepseek-v4-pro: "cline:deepseek-v4-pro"
  opencode-deepseek-v4-flash: "opencode-cli:deepseek-v4-flash"
  opencode-deepseek-v4-pro: "opencode-cli:deepseek-v4-pro"
  copilot-gpt-5.6-luna: "copilot-cli:gpt-5.6-luna"
  copilot-gpt-5.6-terra: "copilot-cli:gpt-5.6-terra"
  copilot-gemini-3.6-flash: "copilot-cli:gemini-3.6-flash"
  copilot-gemini-3.5-flash: "copilot-cli:gemini-3.5-flash"
  copilot-gpt-5.4: "copilot-cli:gpt-5.4"
  copilot-gpt-5.4-mini: "copilot-cli:gpt-5.4-mini"
  copilot-claude-opus-4.8-fast: "copilot-cli:claude-opus-4.8-fast"
  copilot-grok-4.5: "copilot-cli:grok-4.5"
  copilot-kimi-k2.7-code: "copilot-cli:kimi-k2.7-code"
