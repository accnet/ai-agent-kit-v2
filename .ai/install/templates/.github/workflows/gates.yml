name: AI-Kit gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # The kit's own engine tests live in the AI-Kit repository's tests/ and
      # are NOT part of what install.sh copies into a project, so a freshly
      # installed project has no tests/ and `unittest discover -s tests` would
      # fail with "Start directory is not importable" on step one. Guard it so
      # the gate passes on a clean install and still runs wherever a tests/
      # directory does exist.
      - name: Engine tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests/ directory in this project; skipping engine tests."
          fi
      - name: Validate kit contracts
        run: bash .ai/scripts/check-kit.sh
      - name: Validate skill contracts
        run: bash .ai/scripts/check-skills.sh
      - name: Gate G4 hygiene
        run: bash .ai/scripts/check-gates.sh all
