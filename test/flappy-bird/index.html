<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      align-items: center;
      background: #18233a;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    main { position: relative; width: min(92vw, 420px); }
    canvas {
      background: #70c5ce;
      border: 4px solid #102038;
      border-radius: 10px;
      display: block;
      height: auto;
      max-height: 92vh;
      width: 100%;
    }
    .hint { color: #d9e7ff; font-size: .8rem; margin: .65rem 0 0; text-align: center; }
  </style>
</head>
<body>
  <main>
    <canvas id="game" width="400" height="600" aria-label="Flappy Bird game"></canvas>
    <p class="hint">Click or press Space to flap</p>
  </main>
  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const WIDTH = canvas.width;
      const HEIGHT = canvas.height;
      const GROUND_Y = HEIGHT - 52;
      const bird = { x: 100, y: 260, radius: 14, velocity: 0 };
      const settings = { gravity: 0.34, flapVelocity: -6.4, pipeSpeed: 2.2, pipeWidth: 62, gap: 152 };
      let state = 'ready';
      let score = 0;
      let pipes = [];
      let lastTime = 0;
      let spawnTimer = 0;

      function reset() {
        bird.y = 260;
        bird.velocity = 0;
        score = 0;
        pipes = [];
        spawnTimer = 0;
        state = 'ready';
      }

      function startOrFlap() {
        if (state === 'gameover') {
          reset();
          state = 'playing';
        } else if (state === 'ready') {
          state = 'playing';
        }
        bird.velocity = settings.flapVelocity;
      }

      function spawnPipe() {
        const minimumTop = 70;
        const maximumTop = GROUND_Y - settings.gap - 70;
        const top = minimumTop + Math.random() * (maximumTop - minimumTop);
        pipes.push({ x: WIDTH + settings.pipeWidth, top, counted: false });
      }

      function circleIntersectsRect(circle, rect) {
        const nearestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
        const nearestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
        const dx = circle.x - nearestX;
        const dy = circle.y - nearestY;
        return dx * dx + dy * dy < circle.radius * circle.radius;
      }

      function endGame() {
        state = 'gameover';
        bird.velocity = 0;
      }

      function update(delta) {
        if (state !== 'playing') return;
        const step = Math.min(delta / 16.67, 2);
        bird.velocity += settings.gravity * step;
        bird.y += bird.velocity * step;
        // The ceiling is a boundary, not a collision: clamp and keep playing.
        bird.y = Math.max(bird.radius, bird.y);
        if (bird.y + bird.radius >= GROUND_Y) {
          bird.y = GROUND_Y - bird.radius;
          endGame();
          return;
        }

        spawnTimer += delta;
        if (spawnTimer >= 1450) {
          spawnTimer -= 1450;
          spawnPipe();
        }
        pipes.forEach((pipe) => {
          pipe.x -= settings.pipeSpeed * step;
          if (!pipe.counted && pipe.x + settings.pipeWidth < bird.x) {
            pipe.counted = true;
            score += 1;
          }
          const topRect = { x: pipe.x, y: 0, width: settings.pipeWidth, height: pipe.top };
          const bottomRect = {
            x: pipe.x,
            y: pipe.top + settings.gap,
            width: settings.pipeWidth,
            height: GROUND_Y - (pipe.top + settings.gap)
          };
          if (circleIntersectsRect(bird, topRect) || circleIntersectsRect(bird, bottomRect)) endGame();
        });
        pipes = pipes.filter((pipe) => pipe.x + settings.pipeWidth > 0);
      }

      function drawPipe(pipe) {
        const cap = 8;
        ctx.fillStyle = '#58b947';
        ctx.strokeStyle = '#2c752d';
        ctx.lineWidth = 3;
        ctx.fillRect(pipe.x, 0, settings.pipeWidth, pipe.top);
        ctx.strokeRect(pipe.x, 0, settings.pipeWidth, pipe.top);
        ctx.fillRect(pipe.x - cap / 2, pipe.top - 22, settings.pipeWidth + cap, 22);
        ctx.strokeRect(pipe.x - cap / 2, pipe.top - 22, settings.pipeWidth + cap, 22);
        const bottomY = pipe.top + settings.gap;
        ctx.fillRect(pipe.x, bottomY, settings.pipeWidth, GROUND_Y - bottomY);
        ctx.strokeRect(pipe.x, bottomY, settings.pipeWidth, GROUND_Y - bottomY);
        ctx.fillRect(pipe.x - cap / 2, bottomY, settings.pipeWidth + cap, 22);
        ctx.strokeRect(pipe.x - cap / 2, bottomY, settings.pipeWidth + cap, 22);
      }

      function drawBird() {
        ctx.fillStyle = '#f6d34a';
        ctx.strokeStyle = '#9b6d25';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(bird.x + 7, bird.y - 5, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(bird.x + 8, bird.y - 5, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f28c28';
        ctx.beginPath();
        ctx.moveTo(bird.x + 11, bird.y + 2);
        ctx.lineTo(bird.x + 25, bird.y + 6);
        ctx.lineTo(bird.x + 11, bird.y + 9);
        ctx.fill();
      }

      function draw() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = '#70c5ce';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        pipes.forEach(drawPipe);
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, GROUND_Y, WIDTH, HEIGHT - GROUND_Y);
        ctx.fillStyle = '#9bc34b';
        ctx.fillRect(0, GROUND_Y, WIDTH, 8);
        drawBird();
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px system-ui, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#314452';
        ctx.lineWidth = 5;
        ctx.strokeText(String(score), WIDTH / 2, 62);
        ctx.fillText(String(score), WIDTH / 2, 62);
        if (state === 'ready' || state === 'gameover') drawOverlay();
      }

      function drawOverlay() {
        ctx.fillStyle = 'rgba(13, 24, 42, .72)';
        ctx.fillRect(30, 190, WIDTH - 60, state === 'gameover' ? 220 : 170);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px system-ui, sans-serif';
        ctx.fillText(state === 'gameover' ? 'Game Over' : 'Flappy Bird', WIDTH / 2, 245);
        ctx.font = '20px system-ui, sans-serif';
        if (state === 'gameover') {
          ctx.fillText(`Score: ${score}`, WIDTH / 2, 285);
          ctx.fillText('Click or press Space to restart', WIDTH / 2, 335);
        } else {
          ctx.fillText('Click or press Space to start', WIDTH / 2, 300);
        }
      }

      function frame(timestamp) {
        const delta = lastTime ? timestamp - lastTime : 16.67;
        lastTime = timestamp;
        update(delta);
        draw();
        window.requestAnimationFrame(frame);
      }

      canvas.addEventListener('click', startOrFlap);
      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          event.preventDefault();
          startOrFlap();
        }
      });
      reset();
      draw();
      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
